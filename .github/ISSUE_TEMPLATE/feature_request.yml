name: Feature request
description: Suggest an improvement to collecting or using archives
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to accomplish?
      description: Describe the current workflow and the gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain what should happen and any alternatives you considered.
