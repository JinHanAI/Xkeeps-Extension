<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xkeeps - 存档查看 / Archive Viewer</title>
<link rel="icon" type="image/png" href="icons/icon32.png">
<style>
:root {
  --bg: #000;
  --surface: #16181c;
  --surface-hover: #1d1f23;
  --border: #2f3336;
  --text: #e7e9ea;
  --text-secondary: #71767b;
  --accent: #1d9bf0;
  --accent-hover: #1a8cd8;
  --green: #00ba7c;
  --pink: #f91880;
  --orange: #ff7a00;
  --sidebar-w: 280px;
  --header-h: 53px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
}

/* Layout */
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  overflow: hidden;
}

.sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.sidebar-header svg { width: 24px; height: 24px; fill: var(--text); }

.folder-filter {
  padding: 8px 12px;
  flex-shrink: 0;
}

.folder-filter input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 12px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}

.folder-filter input:focus { border-color: var(--accent); }

.folder-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.folder-item {
  padding: 8px 16px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.15s;
  user-select: none;
}

.folder-item:hover { background: var(--surface-hover); }
.folder-item.active { background: var(--surface); color: var(--accent); font-weight: 600; }

.folder-count {
  font-size: 12px;
  background: var(--surface);
  padding: 1px 8px;
  border-radius: 12px;
  color: var(--text-secondary);
  min-width: 28px;
  text-align: center;
}

.folder-item.active .folder-count { background: rgba(29,155,240,0.15); color: var(--accent); }

/* Main content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
}

/* Header / Search */
.header {
  height: var(--header-h);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  backdrop-filter: blur(12px);
  background: rgba(0,0,0,0.65);
  position: sticky;
  top: 0;
  z-index: 10;
}

.search-box {
  flex: 1;
  max-width: 500px;
  position: relative;
}

.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  fill: var(--text-secondary);
  pointer-events: none;
}

.search-box input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 8px 12px 8px 38px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}

.search-box input:focus { border-color: var(--accent); }
.search-box input:focus + svg { fill: var(--accent); }

.result-count {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
}

.sort-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.sort-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Tweet feed */
.feed {
  flex: 1;
  overflow-y: auto;
  position: relative;
}

.feed-inner {
  position: relative;
  max-width: 700px;
  margin: 0 auto;
}

/* Tweet card */
.tweet {
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  transition: background 0.1s;
  cursor: default;
  position: absolute;
  width: 100%;
  left: 0;
}

.tweet:hover { background: var(--surface-hover); }

.tweet-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--surface);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.tweet-author {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.author-name {
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.author-handle {
  font-size: 13px;
  color: var(--text-secondary);
}

.tweet-date {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  margin-left: auto;
}

.tweet-date a { color: var(--text-secondary); text-decoration: none; }
.tweet-date a:hover { text-decoration: underline; }

/* Tweet text */
.tweet-text {
  font-size: 15px;
  line-height: 1.5;
  word-wrap: break-word;
  overflow-wrap: break-word;
  margin: 4px 0 0 48px;
  white-space: pre-wrap;
}

.tweet-text a { color: var(--accent); text-decoration: none; }
.tweet-text a:hover { text-decoration: underline; }
.tweet-text .hashtag { color: var(--accent); }
.tweet-text .mention { color: var(--accent); }

/* Reply indicator */
.reply-indicator {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0 0 4px 48px;
}

.reply-indicator a { color: var(--accent); text-decoration: none; }

/* Media */
.tweet-media {
  margin: 10px 0 0 48px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.tweet-media.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.tweet-media.grid-3 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
.tweet-media.grid-3 > :first-child { grid-row: 1 / -1; }
.tweet-media.grid-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }

.media-item {
  position: relative;
  background: var(--surface);
  min-height: 120px;
  max-height: 400px;
  overflow: hidden;
}

.media-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.media-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.media-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 120px;
  color: var(--text-secondary);
  font-size: 13px;
  gap: 6px;
  padding: 16px;
  text-align: center;
}

.media-placeholder svg { width: 20px; height: 20px; fill: var(--text-secondary); }

.gif-badge {
  position: absolute;
  bottom: 8px;
  left: 8px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
}

/* Card */
.tweet-card {
  margin: 10px 0 0 48px;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: background 0.15s;
}

.tweet-card:hover { background: var(--surface); }

.card-body {
  padding: 12px;
}

.card-domain {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-title {
  font-size: 14px;
  font-weight: 400;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Poll card */
.tweet-poll {
  margin: 10px 0 0 48px;
  padding: 8px 0;
}

.poll-label {
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
}

/* Quoted tweet */
.quoted-tweet {
  margin: 10px 0 0 48px;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px;
  cursor: pointer;
  transition: background 0.15s;
}

.quoted-tweet:hover { background: var(--surface); }

.qt-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.qt-avatar {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
}

.qt-name { font-size: 13px; font-weight: 700; }
.qt-handle { font-size: 13px; color: var(--text-secondary); }

.qt-text {
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
}

.qt-unavailable {
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
}

/* Metrics */
.tweet-metrics {
  display: flex;
  gap: 24px;
  margin: 8px 0 0 48px;
  padding-top: 4px;
}

.metric {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: default;
}

.metric svg { width: 16px; height: 16px; fill: var(--text-secondary); }
.metric.replies:hover svg { fill: var(--accent); }
.metric.retweets:hover svg { fill: var(--green); }
.metric.likes:hover svg { fill: var(--pink); }
.metric.bookmarks:hover svg { fill: var(--accent); }
.metric.views:hover svg { fill: var(--text-secondary); }

/* Folder tags */
.tweet-folders {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 8px 0 0 48px;
}

.folder-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  background: rgba(29,155,240,0.12);
  color: var(--accent);
  cursor: pointer;
  transition: background 0.15s;
}

.folder-tag:hover { background: rgba(29,155,240,0.25); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* Loading */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 12px;
  padding: 20px;
}

.loading-screen h2 { font-size: 24px; font-weight: 700; }

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-status { color: var(--text-secondary); font-size: 14px; text-align: center; }

.progress-bar-outer {
  width: 300px;
  max-width: 80vw;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-inner {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  transition: width 0.2s;
}

.error-box {
  background: #2d1215;
  border: 1px solid #f4212e;
  border-radius: 12px;
  padding: 16px 20px;
  max-width: 600px;
  width: 100%;
  text-align: left;
}

.error-box h3 { color: #f4212e; font-size: 16px; margin-bottom: 8px; }
.error-box p { font-size: 13px; color: var(--text-secondary); margin: 4px 0; line-height: 1.5; }
.error-box code { font-size: 12px; color: var(--text); background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; word-break: break-all; }
.error-box .error-detail { color: #f4212e; font-family: monospace; font-size: 12px; margin: 8px 0; word-break: break-all; }
.error-box ul { font-size: 13px; color: var(--text-secondary); margin: 8px 0 0 18px; line-height: 1.7; }

.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 32px 24px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}

.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  background: rgba(29,155,240,0.05);
}

.drop-zone p { font-size: 14px; color: var(--text-secondary); margin: 6px 0; }
.drop-zone .drop-icon { font-size: 32px; margin-bottom: 4px; }
.drop-zone input[type=file] { display: none; }
.drop-zone .browse-link { color: var(--accent); cursor: pointer; text-decoration: underline; }

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-secondary);
  text-align: center;
  gap: 8px;
}

.empty-state svg { width: 48px; height: 48px; fill: var(--text-secondary); opacity: 0.5; }
.empty-state h3 { font-size: 18px; color: var(--text); }

/* Search highlight */
mark {
  background: rgba(29,155,240,0.3);
  color: var(--text);
  border-radius: 2px;
  padding: 0 1px;
}

/* Keyboard hint */
.kbd-hint {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  z-index: 100;
  opacity: 0.8;
}

kbd {
  background: var(--border);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-family: inherit;
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .sidebar.open { display: flex; position: fixed; z-index: 50; background: var(--bg); height: 100vh; }
  .tweet-text, .tweet-media, .tweet-card, .quoted-tweet, .tweet-metrics, .tweet-folders, .reply-indicator, .tweet-poll { margin-left: 0; }
}

/* Back to top */
.back-to-top {
  position: fixed;
  bottom: 60px;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: transform 0.15s;
}

.back-to-top:hover { transform: scale(1.1); }
.back-to-top svg { width: 20px; height: 20px; fill: #fff; }
.back-to-top.visible { display: flex; }
#import-expectation, .archive-bar details p { white-space: pre-line; }
</style>
<style>
.archive-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
.archive-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.archive-bar p { font-size: 13px; line-height: 1.5; margin: 4px 0; color: #aeb8c2; }
.archive-bar select { max-width: 100%; background: var(--bg); color: var(--text); padding: 6px; border: 1px solid var(--border); border-radius: 6px; }
.archive-bar button, dialog button { padding: 8px 12px; border: 1px solid #536471; border-radius: 18px; background: transparent; color: var(--text); cursor: pointer; }
.archive-bar button.primary, dialog button.primary { background: #0876be; border-color: #0876be; color: white; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #1d9bf0; outline-offset: 3px; }
#archive-status { color: var(--text); }
.archive-note { color: #efb872; padding: 6px 0; font-size: 13px; }
dialog { margin: auto; width: min(560px, calc(100vw - 32px)); max-height: 85vh; overflow: auto; padding: 24px; background: var(--surface); color: var(--text); border: 1px solid #536471; border-radius: 12px; }
dialog::backdrop { background: #000a; }
dialog h2 { margin-bottom: 12px; }
dialog p { margin: 10px 0; line-height: 1.5; overflow-wrap: anywhere; }
.archive-summary { font-size: 17px; font-weight: 600; }
.folder-item { width: 100%; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
.folder-tag { font: inherit; }
.browse-link { border: 0; background: none; font: inherit; }
#mobile-folder { display: none; max-width: 100%; background: var(--bg); color: var(--text); padding: 8px; border: 1px solid var(--border); }
@media (max-width: 700px) { #mobile-folder { display: block; width: 100%; } }
@media (max-width: 600px) { .archive-bar { padding: 8px; max-height: 42vh; overflow: auto; } .archive-actions button { padding: 7px 9px; font-size: 12px; } .header { flex-wrap: wrap; height: auto; min-height: 53px; padding: 8px; } }
</style>
</head>
<body>

<div id="loading" class="loading-screen">
  <svg viewBox="0 0 24 24" width="48" height="48" fill="#1d9bf0"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
  <h2>Xkeeps</h2>
  <div id="load-spinner" class="spinner"></div>
  <div class="progress-bar-outer" id="progress-bar" style="display:none">
    <div class="progress-bar-inner" id="progress-fill"></div>
  </div>
  <div id="load-status" class="loading-status">正在初始化…</div>
  <div id="load-error"></div>
  <div id="drop-zone-container"></div>
</div>

<div id="app" class="app" style="display:none">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h12v2H3v-2z"/></svg>
      文件夹
    </div>
    <div class="folder-filter">
      <input type="text" id="folder-search" aria-label="查找文件夹" placeholder="查找文件夹…" autocomplete="off">
    </div>
    <div class="folder-list" id="folder-list"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <section class="archive-bar" aria-label="本地存档">
      <label for="archive-account">选择存档</label>
      <select id="archive-account" aria-label="选择存档"></select>
      <div class="archive-actions">
        <button class="primary" id="update-archive">导入更新</button>
        <button id="open-archive">更换存档</button>
        <button id="download-archive">下载存档</button>
        <button id="undo-archive" disabled>撤销更新</button>
      </div>
      <p id="archive-status" role="status" aria-live="polite"></p>
      <details><summary>更新说明</summary>
        <p>导入更新可补充内容，已有记录会保留。
账号分别保存；保存后可撤销。</p>
        <p id="archive-coverage"></p>
        <p id="archive-refresh"></p>
        <p>存档保存在此浏览器，请下载备份。
存档中的媒体链接可能失效。</p>
      </details>
    </section>
    <div class="header">
      <select id="mobile-folder" aria-label="按文件夹筛选"></select>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.824 5.262l4.781 4.781-1.414 1.414-4.781-4.781c-1.447 1.142-3.276 1.824-5.262 1.824-4.694 0-8.5-3.806-8.5-8.5z"/></svg>
        <input type="text" id="search" aria-label="搜索收藏" placeholder="搜索收藏…" autocomplete="off" spellcheck="false">
      </div>
      <span class="result-count" id="result-count"></span>
      <button class="sort-btn" id="sort-btn" title="切换排序">最新</button>
    </div>
    <div class="feed" id="feed">
      <div class="feed-inner" id="feed-inner"></div>
    </div>
  </main>
</div>

<div id="likes-view" hidden style="height:100vh;overflow:auto;padding:24px;max-width:880px;margin:auto">
  <h1>Xkeeps · 浏览点赞</h1>
  <p id="likes-view-meta" style="color:var(--text-secondary);margin:12px 0"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0">
    <input id="likes-view-search" type="search" placeholder="搜索正文、作者、用户名" aria-label="搜索点赞" style="flex:1;min-width:220px;padding:10px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px">
    <button id="likes-view-open">更换存档</button><button id="likes-view-back">查看收藏</button>
  </div>
  <p id="likes-view-count" role="status"></p>
  <div id="likes-view-list"></div>
</div>

<button class="back-to-top" id="back-to-top" title="返回顶部">
  <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
</button>

<div class="kbd-hint" id="kbd-hint">
  <kbd>/</kbd> 搜索 &nbsp; <kbd>Esc</kbd> 清空 &nbsp; <kbd>G</kbd> 回到顶部
</div>

<dialog id="import-review" aria-labelledby="import-title">
  <h2 id="import-title">确认更新</h2>
  <p id="import-source"></p>
  <p id="import-summary" class="archive-summary"></p>
  <p id="import-coverage"></p>
  <p id="import-expectation">保存前存档不变；保存后可撤销。</p>
  <p id="import-error" role="alert"></p>
  <div class="archive-actions"><button id="import-cancel">取消</button><button class="primary" id="import-save">保存更新</button></div>
</dialog>
<input id="archive-file" type="file" accept=".json,application/json" hidden>
<script src="lib/archive.js"></script>
<script src="lib/i18n.js"></script>
<script src="ui-locale-init.js"></script>
<script src="lib/search-index.js"></script>
<script src="lib/viewer-workflow.js"></script>
<script src="viewer.js"></script>
</body>
</html>
